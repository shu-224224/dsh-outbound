# Bundle patch for dsh-outbound: installing the package as a DSH bundle
# inserts one plugin row. A hand install (see README) adds the same row to the
# profile's cordis.patch.yml instead.
- insert:
    - id: dsh-outbound
      name: dsh-outbound
      config:
        enabled: true
        mode: system
        proxy: ''
        keepModelDirect: true
        noProxy: []
        emergencyDirectHosts: []
        fallbackToDirect: false
        probeUrl: https://www.gstatic.com/generate_204
        pollIntervalMs: 2000
        probeIntervalMs: 5000
        probeTimeoutMs: 2500
